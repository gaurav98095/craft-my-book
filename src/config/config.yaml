# Central place for pipeline choices.
#
# Nested by component so any single model/provider can be tweaked without touching
# anything else: first-level key = pipeline component (ingestion; later toc, writer,
# ...), and inside that, each sub-component owns its own model settings. e.g.
# ingestion.speech.cleaning_llm and ingestion.speech.vocab_llm don't have to agree
# with each other, let alone with whatever a future "writer" component uses.

ingestion:
  # shared across every ingestion strategy (speech today; pdf/docx/pptx/image later)
  output_dir: output/transcripts

  speech:
    # Module 1.2 - speech transcription.
    whisper:
      # "small" while iterating locally - fully cached after the first run, fast, no
      # multi-GB download. Switch to "large-v3" for real lecture-quality transcription
      # once you have a stable connection (and ideally a GPU) - see ingestion/speech.py
      # for why domain accuracy matters there.
      model_size: small
      device: auto
      compute_type: auto

    # fast draft pass used only to bootstrap vocab from audio when no other material
    # exists (ingestion/vocab.py: bootstrap_vocab_from_audio) - deliberately cheap
    draft_whisper:
      model_size: small

    # conservative post-transcription cleanup pass (fix terms/punctuation only)
    cleaning_llm:
      provider: openai
      model: gpt-4o-mini

    # domain vocabulary extraction/bootstrapping, used to prime whisper
    vocab_llm:
      provider: openai
      model: gpt-4o-mini
      max_terms: 60

  layout:
    # Module 1.3 - MinerU layout parsing (PDF/DOCX/PPTX/XLSX). Purely deterministic -
    # no LLM here. MinerU finds figures/tables/equations and reconstructs reading
    # order; a later module (Qwen-VL) is what *understands* what's inside them.
    #
    # "pipeline" backend runs fully local (CPU or GPU, no external service). First run
    # pulls model weights - see MINERU_MODEL_SOURCE in .env (huggingface/modelscope/
    # local) if the default mirror is slow/unreachable, or pre-fetch with
    # `mineru-models-download`.
    backend: pipeline
    work_dir: output/layout
